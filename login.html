<!DOCTYPE html>
<html lang="{{ lang or 'en' }}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCam Lite - Login</title>
    <style>
        :root {
            --bg: #0f1115;
            --card: #181b22;
            --border: #2a2f3a;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --text: #f3f4f6;
            --muted: #9ca3af;
            --danger: #ef4444;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
        }
        .login-card {
            background: var(--card);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 380px;
            padding: 32px;
            box-shadow: 0 20px 40px rgba(0,0,0,0.45);
        }
        .brand {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            margin-bottom: 24px;
            font-size: 1.4rem;
            font-weight: 700;
        }
        .brand-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: var(--accent);
            box-shadow: 0 0 12px var(--accent);
        }
        .form-group { margin-bottom: 16px; }
        label {
            display: block;
            font-size: 0.85rem;
            color: var(--muted);
            margin-bottom: 6px;
        }
        input {
            width: 100%;
            padding: 11px 14px;
            background: #111318;
            border: 1px solid var(--border);
            border-radius: 8px;
            color: var(--text);
            font-size: 0.95rem;
            outline: none;
        }
        input:focus { border-color: var(--accent); }
        button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: #fff;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            margin-top: 8px;
            transition: background 0.15s;
        }
        button:hover { background: var(--accent-hover); }
        .error-box {
            background: rgba(239, 68, 68, 0.15);
            border: 1px solid var(--danger);
            color: #fca5a5;
            padding: 10px 12px;
            border-radius: 8px;
            font-size: 0.85rem;
            margin-bottom: 16px;
            text-align: center;
        }
        .hint {
            margin-top: 18px;
            text-align: center;
            font-size: 0.78rem;
            color: var(--muted);
        }
    </style>
</head>
<body>
    <div class="login-card">
        <div class="brand">
            <span class="brand-dot"></span>
            <span>OpenCam Lite</span>
        </div>
        {% if error %}
        <div class="error-box">{{ error }}</div>
        {% endif %}
        <form method="POST" action="/login">
            <div class="form-group">
                <label>Username / Benutzername</label>
                <input type="text" name="username" required autofocus autocomplete="username">
            </div>
            <div class="form-group">
                <label>Password / Passwort</label>
                <input type="password" name="password" required autocomplete="current-password">
            </div>
            <button type="submit">Login / Anmelden</button>
        </form>
        <div class="hint">Default: admin / admin</div>
    </div>
</body>
</html>
