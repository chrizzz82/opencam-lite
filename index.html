<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCam Lite</title>
    <style>
        :root {
            --bg: #0d0f13;
            --panel: #161920;
            --panel-alt: #1e222b;
            --border: #2a303c;
            --accent: #3b82f6;
            --accent-hover: #2563eb;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text: #f3f4f6;
            --muted: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }
        /* Topbar */
        header {
            background: var(--panel);
            border-bottom: 1px solid var(--border);
            padding: 12px 22px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 12px;
        }
        .brand-wrap {
            display: flex;
            align-items: center;
            gap: 16px;
        }
        .brand-title {
            font-size: 1.2rem;
            font-weight: 700;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .live-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--success);
            box-shadow: 0 0 8px var(--success);
        }
        .nav-tabs {
            display: flex;
            gap: 6px;
        }
        .tab-btn {
            background: transparent;
            color: var(--muted);
            border: 1px solid transparent;
            padding: 7px 14px;
            border-radius: 8px;
            cursor: pointer;
            font-weight: 600;
            font-size: 0.9rem;
        }
        .tab-btn.active {
            background: var(--panel-alt);
            color: var(--text);
            border-color: var(--border);
        }
        .header-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        select, input, button {
            font-family: inherit;
            font-size: 0.88rem;
        }
        .btn {
            background: var(--panel-alt);
            color: var(--text);
            border: 1px solid var(--border);
            padding: 7px 13px;
            border-radius: 7px;
            cursor: pointer;
            font-weight: 500;
            transition: all 0.15s;
        }
        .btn:hover { border-color: var(--accent); }
        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #fff;
        }
        .btn-primary:hover { background: var(--accent-hover); }
        .btn-danger {
            background: rgba(239, 68, 68, 0.15);
            border-color: var(--danger);
            color: #fca5a5;
        }
        .badge {
            padding: 4px 8px;
            border-radius: 6px;
            font-size: 0.75rem;
            font-weight: 600;
            background: var(--panel-alt);
            border: 1px solid var(--border);
        }

        /* Main Viewports */
        main { flex: 1; padding: 20px; }
        .hidden { display: none !important; }

        /* Customizable Live Grid */
        .camera-grid {
            display: flex;
            flex-wrap: wrap;
            gap: 16px;
            align-items: flex-start;
        }
        .cam-tile {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            width: 560px;
            height: 370px;
            min-width: 300px;
            min-height: 220px;
            resize: both;
            position: relative;
            box-shadow: 0 8px 20px rgba(0,0,0,0.3);
        }
        .cam-header {
            padding: 8px 12px;
            background: var(--panel-alt);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            user-select: none;
        }
        .cam-title {
            font-weight: 600;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .status-pill {
            font-size: 0.7rem;
            padding: 2px 7px;
            border-radius: 4px;
            font-weight: 700;
        }
        .mode-live { background: #374151; color: #e5e7eb; }
        .mode-motion { background: rgba(245, 158, 11, 0.2); color: #fbbf24; border: 1px solid var(--warning); }
        .mode-247 { background: rgba(16, 185, 129, 0.2); color: #34d399; border: 1px solid var(--success); }

        .cam-viewport {
            flex: 1;
            background: #050608;
            position: relative;
            overflow: hidden;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .cam-viewport:active { cursor: grabbing; }
        .cam-stream {
            width: 100%;
            height: 100%;
            object-fit: contain;
            transform-origin: center center;
            transition: transform 0.05s linear;
            pointer-events: none;
        }
        .cam-controls {
            padding: 7px 12px;
            background: var(--panel);
            border-top: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 6px;
            flex-wrap: wrap;
        }
        .ptz-pad {
            display: flex;
            gap: 4px;
        }
        .ptz-btn {
            padding: 4px 8px;
            font-size: 0.78rem;
            background: var(--panel-alt);
            border: 1px solid var(--border);
            color: var(--text);
            border-radius: 5px;
            cursor: pointer;
        }
        .ptz-btn:hover { border-color: var(--accent); }

        /* Archive Section */
        .archive-bar {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 14px 18px;
            display: flex;
            flex-wrap: wrap;
            gap: 14px;
            align-items: flex-end;
            margin-bottom: 18px;
        }
        .field-col {
            display: flex;
            flex-direction: column;
            gap: 5px;
        }
        .field-col label {
            font-size: 0.78rem;
            color: var(--muted);
        }
        .input-ctrl {
            background: #101318;
            border: 1px solid var(--border);
            color: var(--text);
            padding: 7px 11px;
            border-radius: 7px;
        }
        .archive-table {
            width: 100%;
            border-collapse: collapse;
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: hidden;
        }
        .archive-table th, .archive-table td {
            padding: 11px 14px;
            text-align: left;
            border-bottom: 1px solid var(--border);
            font-size: 0.88rem;
        }
        .archive-table th {
            background: var(--panel-alt);
            color: var(--muted);
            font-weight: 600;
        }

        /* Modals */
        .modal-backdrop {
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.75);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 1000;
            padding: 20px;
        }
        .modal-box {
            background: var(--panel);
            border: 1px solid var(--border);
            border-radius: 12px;
            width: 100%;
            max-width: 880px;
            max-height: 90vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 14px 20px;
            background: var(--panel-alt);
            border-bottom: 1px solid var(--border);
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 20px;
            overflow-y: auto;
            flex: 1;
        }
        .settings-subtabs {
            display: flex;
            gap: 8px;
            border-bottom: 1px solid var(--border);
            padding-bottom: 12px;
            margin-bottom: 18px;
        }
        .grid-2 {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 14px;
        }
        .card-section {
            background: var(--panel-alt);
            border: 1px solid var(--border);
            border-radius: 9px;
            padding: 15px;
            margin-bottom: 16px;
        }
        .card-section h4 {
            margin-bottom: 12px;
            font-size: 0.95rem;
        }
        .zone-canvas-wrap {
            position: relative;
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            border: 1px solid var(--border);
            background: #000;
        }
        .zone-canvas-wrap img {
            width: 100%;
            display: block;
        }
        .zone-canvas-wrap canvas {
            position: absolute;
            inset: 0;
            width: 100%;
            height: 100%;
            cursor: crosshair;
        }
    </style>
</head>
<body>

<header>
    <div class="brand-wrap">
        <div class="brand-title">
            <span class="live-dot"></span>
            <span>OpenCam Lite</span>
        </div>
        <div class="nav-tabs">
            <button class="tab-btn active" id="tabBtnLive" onclick="switchMainTab('live')" data-i18n="tab_live">Live Grid</button>
            <!-- Archiv-Tab wird für Read-Only Benutzer strikt ausgeblendet -->
            <button class="tab-btn hidden" id="tabBtnArchive" onclick="switchMainTab('archive')" data-i18n="tab_archive">Archive</button>
        </div>
    </div>

    <div class="header-actions">
        <select class="input-ctrl" id="langSelect" onchange="changeLanguage(this.value)">
            <option value="en">EN</option>
            <option value="de">DE</option>
            <option value="fr">FR</option>
            <option value="es">ES</option>
        </select>

        <!-- Einstellungen-Button nur für Administratoren sichtbar -->
        <button class="btn btn-primary hidden" id="btnOpenSettings" onclick="openSettingsModal()" data-i18n="btn_settings">Settings</button>

        <span class="badge" id="userBadge"></span>
        <a href="/logout" class="btn" style="text-decoration:none;" data-i18n="btn_logout">Logout</a>
    </div>
</header>

<main>
    <!-- LIVE GRID VIEW -->
    <section id="viewLive">
        <div class="camera-grid" id="cameraGrid"></div>
    </section>

    <!-- ARCHIVE VIEW (NUR ADMIN) -->
    <section id="viewArchive" class="hidden">
        <div class="archive-bar">
            <div class="field-col">
                <label data-i18n="lbl_date">Date (YYYY-MM-DD)</label>
                <select class="input-ctrl" id="archDateSelect" onchange="loadArchive()"></select>
            </div>
            <div class="field-col">
                <label data-i18n="lbl_from">From (HH:MM)</label>
                <input type="time" class="input-ctrl" id="archFrom" value="00:00">
            </div>
            <div class="field-col">
                <label data-i18n="lbl_to">To (HH:MM)</label>
                <input type="time" class="input-ctrl" id="archTo" value="23:59">
            </div>
            <div class="field-col">
                <label data-i18n="lbl_camera">Camera</label>
                <select class="input-ctrl" id="archCamSelect">
                    <option value="">All</option>
                </select>
            </div>
            <button class="btn btn-primary" onclick="loadArchive()" data-i18n="btn_filter">Filter</button>
            <button class="btn" onclick="exportArchiveZip()" data-i18n="btn_export_zip">ZIP Export</button>
        </div>

        <table class="archive-table">
            <thead>
                <tr>
                    <th data-i18n="lbl_date">Date</th>
                    <th data-i18n="lbl_time">Time</th>
                    <th data-i18n="lbl_camera">Camera</th>
                    <th data-i18n="lbl_mode">Mode</th>
                    <th>Size</th>
                    <th data-i18n="lbl_actions">Actions</th>
                </tr>
            </thead>
            <tbody id="archiveTableBody"></tbody>
        </table>
    </section>
</main>

<!-- SETTINGS MODAL (NUR ADMIN) -->
<div class="modal-backdrop hidden" id="settingsModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 data-i18n="btn_settings">Settings</h3>
            <button class="btn" onclick="closeSettingsModal()">✕</button>
        </div>
        <div class="modal-body">
            <div class="settings-subtabs">
                <button class="tab-btn active" id="subTabCamerasBtn" onclick="switchSettingsTab('cameras')" data-i18n="manage_cameras">Manage Cameras</button>
                <button class="tab-btn" id="subTabRecordingBtn" onclick="switchSettingsTab('recording')" data-i18n="rec_settings">Recording & Alerts</button>
                <button class="tab-btn" id="subTabUsersBtn" onclick="switchSettingsTab('users')" data-i18n="user_mgmt">Users</button>
            </div>

            <!-- SUBTAB 1: KAMERAS VERWALTEN + INTEGRIERTE ONVIF-SUCHE -->
            <div id="subTabCameras">
                <!-- Integrierte Kamerasuche direkt unter Kameras verwalten -->
                <div class="card-section">
                    <h4 data-i18n="scan_title">Search Cameras (ONVIF / Network Scan from .2 to .254)</h4>
                    <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:10px;">
                        <input type="text" class="input-ctrl" id="scanSubnetInput" placeholder="192.168.178" style="width:160px;">
                        <button class="btn btn-primary" id="btnRunScan" onclick="runCameraScan()" data-i18n="btn_scan">Search Cameras</button>
                        <span id="scanStatusText" style="font-size:0.82rem; color:var(--muted);"></span>
                    </div>
                    <div id="scanResultsList" style="display:flex; flex-direction:column; gap:6px;"></div>
                </div>

                <!-- Kamera hinzufügen / bearbeiten -->
                <div class="card-section">
                    <h4 data-i18n="add_edit_cam">Add / Edit Camera</h4>
                    <input type="hidden" id="camIdInput">
                    <div class="grid-2">
                        <div class="field-col">
                            <label data-i18n="lbl_name">Camera Name</label>
                            <input type="text" class="input-ctrl" id="camNameInput" placeholder="Garden / Front Door">
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_brand">Brand Preset</label>
                            <select class="input-ctrl" id="camBrandInput" onchange="applyBrandPreset()">
                                <option value="tapo">TP-Link Tapo (RTSP 554 / ONVIF 2020)</option>
                                <option value="hikvision">Hikvision (RTSP 554 / ONVIF 80)</option>
                                <option value="reolink">Reolink (RTSP 554 / ONVIF 8000)</option>
                                <option value="generic">Generic ONVIF / Custom RTSP</option>
                            </select>
                        </div>
                        <div class="field-col">
                            <label>IP Address</label>
                            <input type="text" class="input-ctrl" id="camIpInput" placeholder="192.168.178.50" oninput="applyBrandPreset()">
                        </div>
                        <div class="field-col">
                            <label>ONVIF Port</label>
                            <input type="number" class="input-ctrl" id="camOnvifPortInput" value="2020">
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_user">Camera Username</label>
                            <input type="text" class="input-ctrl" id="camUserInput" value="admin" oninput="applyBrandPreset()">
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_pass">Camera Password</label>
                            <input type="password" class="input-ctrl" id="camPassInput" oninput="applyBrandPreset()">
                        </div>
                        <div class="field-col">
                            <label>RTSP Stream URL</label>
                            <input type="text" class="input-ctrl" id="camRtspInput" placeholder="rtsp://user:pass@ip:554/stream1">
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_mode">Recording Mode</label>
                            <select class="input-ctrl" id="camModeInput">
                                <option value="live" data-i18n="mode_live_opt">Live Only (No Recording)</option>
                                <option value="motion" data-i18n="mode_motion_opt">Record on Motion</option>
                                <option value="24/7" data-i18n="mode_247_opt">24/7 Continuous Recording</option>
                            </select>
                        </div>
                    </div>
                    <div style="margin-top:12px; display:flex; gap:8px;">
                        <button class="btn btn-primary" onclick="saveCameraForm()" data-i18n="btn_save_cam">Save Camera</button>
                        <button class="btn" onclick="resetCameraForm()" data-i18n="btn_reset">Reset</button>
                    </div>
                </div>

                <!-- Bestehende Kameras -->
                <div class="card-section">
                    <h4 data-i18n="configured_cams">Configured Cameras</h4>
                    <div id="configuredCamList" style="display:flex; flex-direction:column; gap:8px;"></div>
                </div>
            </div>

            <!-- SUBTAB 2: AUFNAHME-INTERVALL (15-120 MIN) & ALERTS -->
            <div id="subTabRecording" class="hidden">
                <div class="card-section">
                    <h4 data-i18n="rec_settings">Recording & System Settings</h4>
                    <div class="grid-2">
                        <div class="field-col">
                            <label data-i18n="lbl_interval">Recording Interval (15 - 120 min)</label>
                            <select class="input-ctrl" id="setIntervalInput">
                                <option value="15">15 min</option>
                                <option value="30">30 min</option>
                                <option value="45">45 min</option>
                                <option value="60">60 min</option>
                                <option value="75">75 min</option>
                                <option value="90">90 min</option>
                                <option value="105">105 min</option>
                                <option value="120">120 min</option>
                            </select>
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_retention">Retention Cleanup (Days)</label>
                            <input type="number" class="input-ctrl" id="setRetentionInput" min="1" max="365" value="7">
                        </div>
                        <div class="field-col">
                            <label>ntfy.sh Topic URL</label>
                            <input type="text" class="input-ctrl" id="setNtfyInput" placeholder="https://ntfy.sh/my_opencam_alerts">
                        </div>
                        <div class="field-col">
                            <label>Home Assistant Webhook URL</label>
                            <input type="text" class="input-ctrl" id="setHaWebhookInput" placeholder="http://homeassistant.local:8123/api/webhook/...">
                        </div>
                    </div>
                    <button class="btn btn-primary" style="margin-top:14px;" onclick="saveSystemSettings()" data-i18n="btn_save">Save Settings</button>
                </div>
            </div>

            <!-- SUBTAB 3: BENUTZERVERWALTUNG (ADMIN & READONLY) -->
            <div id="subTabUsers" class="hidden">
                <div class="card-section">
                    <h4 data-i18n="add_user_title">Create / Update User (Admin or Read-Only)</h4>
                    <div class="grid-2">
                        <div class="field-col">
                            <label data-i18n="lbl_user">Username</label>
                            <input type="text" class="input-ctrl" id="newUsernameInput" placeholder="viewer">
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_pass">Password</label>
                            <input type="password" class="input-ctrl" id="newPasswordInput" placeholder="••••••">
                        </div>
                        <div class="field-col">
                            <label data-i18n="lbl_role">Role</label>
                            <select class="input-ctrl" id="newRoleInput">
                                <option value="readonly" data-i18n="role_readonly">Read-Only (Live View only, No Settings/Archive)</option>
                                <option value="admin" data-i18n="role_admin">Administrator (Full Access)</option>
                            </select>
                        </div>
                    </div>
                    <button class="btn btn-primary" style="margin-top:12px;" onclick="saveUser()" data-i18n="btn_save_user">Save User</button>
                </div>

                <div class="card-section">
                    <h4 data-i18n="existing_users">Existing Users</h4>
                    <div id="usersListContainer" style="display:flex; flex-direction:column; gap:8px;"></div>
                </div>
            </div>
        </div>
    </div>
</div>

<!-- VISUAL ZONE EDITOR MODAL (PRIVACY & MOTION ZONES) -->
<div class="modal-backdrop hidden" id="zoneModal">
    <div class="modal-box">
        <div class="modal-header">
            <h3 id="zoneModalTitle">Visual Zone Editor</h3>
            <button class="btn" onclick="closeZoneModal()">✕</button>
        </div>
        <div class="modal-body">
            <div style="display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-bottom:12px;">
                <button class="btn btn-primary" id="btnDrawPrivacy" onclick="setZoneDrawType('privacy')" data-i18n="btn_privacy_zone">Draw Privacy Zone (Blackout)</button>
                <button class="btn" id="btnDrawMotion" onclick="setZoneDrawType('motion')" data-i18n="btn_motion_zone">Draw Motion Zone</button>
                <button class="btn btn-danger" onclick="clearCurrentZones()" data-i18n="btn_clear_zones">Clear Zones</button>
                <div style="margin-left:auto; display:flex; align-items:center; gap:8px;">
                    <label data-i18n="lbl_sensitivity">Sensitivity</label>
                    <input type="range" id="zoneSensSlider" min="1" max="100" value="50">
                </div>
            </div>
            <div class="zone-canvas-wrap">
                <img id="zonePreviewImg" src="" alt="Zone Feed">
                <canvas id="zoneCanvas"></canvas>
            </div>
            <div style="margin-top:14px; display:flex; justify-content:flex-end; gap:10px;">
                <button class="btn btn-primary" onclick="saveZonesToServer()" data-i18n="btn_save">Save</button>
            </div>
        </div>
    </div>
</div>

<!-- VIDEO PLAYER MODAL -->
<div class="modal-backdrop hidden" id="videoModal">
    <div class="modal-box" style="max-width:760px;">
        <div class="modal-header">
            <h3 id="videoModalTitle">Playback</h3>
            <button class="btn" onclick="closeVideoModal()">✕</button>
        </div>
        <div class="modal-body" style="text-align:center;">
            <video id="archiveVideoPlayer" controls style="width:100%; max-height:70vh; background:#000;"></video>
        </div>
    </div>
</div>

<script>
const I18N = {
    en: {
        tab_live: "Live Grid",
        tab_archive: "Archive",
        btn_settings: "Settings",
        btn_logout: "Logout",
        manage_cameras: "Manage Cameras",
        rec_settings: "Recording & Alerts",
        user_mgmt: "Users",
        scan_title: "Search Cameras (ONVIF / Network Scan from .2 to .254)",
        btn_scan: "Search Cameras",
        add_edit_cam: "Add / Edit Camera",
        lbl_name: "Camera Name",
        lbl_brand: "Brand Preset",
        lbl_user: "Username",
        lbl_pass: "Password",
        lbl_mode: "Recording Mode",
        mode_live_opt: "Live Only (No Recording)",
        mode_motion_opt: "Record on Motion",
        mode_247_opt: "24/7 Continuous Recording",
        btn_save_cam: "Save Camera",
        btn_reset: "Reset",
        configured_cams: "Configured Cameras",
        lbl_interval: "Recording Interval (15 - 120 min)",
        lbl_retention: "Retention Cleanup (Days)",
        btn_save: "Save Settings",
        add_user_title: "Create / Update User",
        lbl_role: "Role",
        role_readonly: "Read-Only (Viewer - No Settings / No Archive)",
        role_admin: "Administrator (Full Access)",
        btn_save_user: "Save User",
        existing_users: "Existing Users",
        lbl_date: "Date",
        lbl_time: "Time",
        lbl_from: "From",
        lbl_to: "To",
        lbl_camera: "Camera",
        lbl_actions: "Actions",
        btn_filter: "Filter",
        btn_export_zip: "ZIP Export",
        btn_privacy_zone: "Privacy Zone (Blackout)",
        btn_motion_zone: "Motion Zone",
        btn_clear_zones: "Clear Zones",
        lbl_sensitivity: "Motion Sensitivity"
    },
    de: {
        tab_live: "Live-Ansicht",
        tab_archive: "Archiv",
        btn_settings: "Einstellungen",
        btn_logout: "Abmelden",

let appState = {
    user: "",
    role: "readonly",
    lang: "en",
    cameras: [],

    zoneDrawType: "privacy",

async function initApp() {
    const res = await fetch("/api/bootstrap");
    if (!res.ok) return;
    const data = await res.json();
    appState.user = data.user;
    appState.role = data.role;
    appState.cameras = data.cameras || [];
    appState.settings = data.settings || {};
    appState.lang = (data.settings && data.settings.language) || "en";

    document.getElementById("userBadge").textContent = `${appState.user} (${appState.role})`;
    document.getElementById("langSelect").value = appState.lang;
    document.getElementById("scanSubnetInput").value = data.detected_subnet || "192.168.178";

    // Rollenprüfung: Nur Admin sieht Archiv-Tab und Einstellungen
    if (appState.role === "admin") {
        document.getElementById("tabBtnArchive").classList.remove("hidden");
        document.getElementById("btnOpenSettings").classList.remove("hidden");
    } else {
        document.getElementById("tabBtnArchive").classList.add("hidden");
        document.getElementById("btnOpenSettings").classList.add("hidden");
    }

    applyTranslations();
    renderLiveGrid();
    populateArchiveCameraSelect();
}

function applyTranslations() {
    const dict = I18N[appState.lang] || I18N.en;
    document.querySelectorAll("[data-i18n]").forEach(el => {
        const key = el.getAttribute("data-i18n");
        if (dict[key]) el.textContent = dict[key];
    });
}

async function changeLanguage(lang) {
    appState.lang = lang;
    applyTranslations();
    if (appState.role === "admin") {
        await fetch("/api/settings", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({language: lang})
        });
    }
}

function switchMainTab(tab) {
    if (tab === "archive" && appState.role !== "admin") return;
    document.getElementById("viewLive").classList.toggle("hidden", tab !== "live");
    document.getElementById("viewArchive").classList.toggle("hidden", tab !== "archive");
    document.getElementById("tabBtnLive").classList.toggle("active", tab === "live");
    document.getElementById("tabBtnArchive").classList.toggle("active", tab === "archive");
    if (tab === "archive") loadArchive();
}

/* ============================================================================
   LIVE GRID MIT LOCALSTORAGE-GRÖSSEN & DIGITALEM ZOOM/PAN
   ============================================================================ */
function renderLiveGrid() {
    const grid = document.getElementById("cameraGrid");
    grid.innerHTML = "";
    const savedSizes = JSON.parse(localStorage.getItem("opencam_tile_sizes") || "{}");

    if (appState.cameras.length === 0) {
        grid.innerHTML = `<div style="color:var(--muted); padding:30px;">No cameras configured yet.</div>`;
        return;
    }

    appState.cameras.forEach(cam => {
        const tile = document.createElement("div");
        tile.className = "cam-tile";
        if (savedSizes[cam.id]) {
            tile.style.width = savedSizes[cam.id].w;
            tile.style.height = savedSizes[cam.id].h;
        }

        const modeClass = cam.recording_mode === "24/7" ? "mode-247" : (cam.recording_mode === "motion" ? "mode-motion" : "mode-live");
        const modeLabel = cam.recording_mode === "24/7" ? "24/7 REC" : (cam.recording_mode === "motion" ? "MOTION" : "LIVE");

        let adminControls = "";
        if (appState.role === "admin") {
            adminControls = `
                <div class="ptz-pad">
                    <button class="ptz-btn" onclick="sendPtz('${cam.id}','left')">◀</button>
                    <button class="ptz-btn" onclick="sendPtz('${cam.id}','up')">▲</button>
                    <button class="ptz-btn" onclick="sendPtz('${cam.id}','down')">▼</button>
                    <button class="ptz-btn" onclick="sendPtz('${cam.id}','right')">▶</button>
                </div>
                <select class="input-ctrl" style="padding:3px 6px; font-size:0.78rem;" onchange="quickChangeMode('${cam.id}', this.value)">
                    <option value="live" ${cam.recording_mode === "live" ? "selected" : ""}>Live</option>
                    <option value="motion" ${cam.recording_mode === "motion" ? "selected" : ""}>Motion</option>
                    <option value="24/7" ${cam.recording_mode === "24/7" ? "selected" : ""}>24/7</option>
                </select>
                <button class="ptz-btn" onclick="openZoneModal('${cam.id}')">Zones</button>
            `;
        }

        tile.innerHTML = `
            <div class="cam-header">
                <div class="cam-title">
                    <span>${cam.name}</span>
                    <span class="status-pill ${modeClass}">${modeLabel}</span>
                </div>
                <a class="ptz-btn" href="/api/snapshot/${cam.id}" style="text-decoration:none;">📷 Snapshot</a>
            </div>
            <div class="cam-viewport" id="vp_${cam.id}">
                <img class="cam-stream" id="img_${cam.id}" src="/api/stream/${cam.id}" alt="${cam.name}">
            </div>
            <div class="cam-controls">
                ${adminControls}
            </div>
        `;

        // Größenänderungen automatisch in localStorage speichern
        const ro = new ResizeObserver(() => {
            if (tile.offsetWidth > 200 && tile.offsetHeight > 150) {
                const cur = JSON.parse(localStorage.getItem("opencam_tile_sizes") || "{}");
                cur[cam.id] = { w: tile.style.width || `${tile.offsetWidth}px`, h: tile.style.height || `${tile.offsetHeight}px` };
                localStorage.setItem("opencam_tile_sizes", JSON.stringify(cur));
            }
        });
        ro.observe(tile);

        grid.appendChild(tile);
        attachZoomPan(document.getElementById(`vp_${cam.id}`), document.getElementById(`img_${cam.id}`));
    });
}

function attachZoomPan(viewport, img) {
    let scale = 1, panX = 0, panY = 0, isDragging = false, startX = 0, startY = 0;

    function updateTransform() {
        img.style.transform = `translate(${panX}px, ${panY}px) scale(${scale})`;
    }

    viewport.addEventListener("wheel", e => {
        e.preventDefault();
        const delta = e.deltaY < 0 ? 0.2 : -0.2;
        scale = Math.min(5, Math.max(1, scale + delta));
        if (scale === 1) { panX = 0; panY = 0; }
        updateTransform();
    });

    viewport.addEventListener("mousedown", e => {
        if (scale <= 1) return;
        isDragging = true;
        startX = e.clientX - panX;
        startY = e.clientY - panY;
    });

    window.addEventListener("mousemove", e => {
        if (!isDragging) return;
        panX = e.clientX - startX;
        panY = e.clientY - startY;
        updateTransform();
    });

    window.addEventListener("mouseup", () => { isDragging = false; });
    viewport.addEventListener("dblclick", () => {
        scale = 1; panX = 0; panY = 0; updateTransform();
    });
}

/* ============================================================================
   VISUAL ZONE EDITOR (PRIVACY BLACKOUT & MOTION ZONES)
   ============================================================================ */
let isDrawingZone = false, zStartX = 0, zStartY = 0;

function openZoneModal(camId) {
    const cam = appState.cameras.find(c => c.id === camId);
    if (!cam) return;
    appState.zoneEditorCam = cam;
    appState.privacyZones = JSON.parse(JSON.stringify(cam.privacy_zones || []));
    appState.motionZones = JSON.parse(JSON.stringify(cam.motion_zones || []));
    document.getElementById("zoneSensSlider").value = cam.motion_sensitivity || 50;
    document.getElementById("zonePreviewImg").src = `/api/stream/${cam.id}`;
    document.getElementById("zoneModal").classList.remove("hidden");
    setTimeout(initZoneCanvas, 200);
}

function closeZoneModal() {
    document.getElementById("zoneModal").classList.add("hidden");
    document.getElementById("zonePreviewImg").src = "";
}

function setZoneDrawType(type) {
    appState.zoneDrawType = type;
    document.getElementById("btnDrawPrivacy").classList.toggle("btn-primary", type === "privacy");
    document.getElementById("btnDrawMotion").classList.toggle("btn-primary", type === "motion");
}

function clearCurrentZones() {
    appState.privacyZones = [];
    appState.motionZones = [];
    drawZonesCanvas();
}

function initZoneCanvas() {
    const canvas = document.getElementById("zoneCanvas");
    const img = document.getElementById("zonePreviewImg");
    canvas.width = img.clientWidth || 640;
    canvas.height = img.clientHeight || 360;
    drawZonesCanvas();

    canvas.onmousedown = e => {
        const rect = canvas.getBoundingClientRect();
        zStartX = (e.clientX - rect.left) / canvas.width;
        zStartY = (e.clientY - rect.top) / canvas.height;
        isDrawingZone = true;
    };

    canvas.onmouseup = e => {
        if (!isDrawingZone) return;
        isDrawingZone = false;
        const rect = canvas.getBoundingClientRect();
        const endX = (e.clientX - rect.left) / canvas.width;
        const endY = (e.clientY - rect.top) / canvas.height;
        const zone = {
            x: Math.min(zStartX, endX),
            y: Math.min(zStartY, endY),
            w: Math.abs(endX - zStartX),
            h: Math.abs(endY - zStartY)
        };
        if (zone.w > 0.02 && zone.h > 0.02) {
            if (appState.zoneDrawType === "privacy") appState.privacyZones.push(zone);
            else appState.motionZones.push(zone);
        }
        drawZonesCanvas();
    };
}

function drawZonesCanvas() {
    const canvas = document.getElementById("zoneCanvas");
    const ctx = canvas.getContext("2d");
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // Privacy Zones (Schwarz)
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.strokeStyle = "#ef4444";
    ctx.lineWidth = 2;
    appState.privacyZones.forEach(z => {
        ctx.fillRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
        ctx.strokeRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
    });

    // Motion Zones (Grün)
    ctx.fillStyle = "rgba(16, 185, 129, 0.25)";
    ctx.strokeStyle = "#10b981";
    appState.motionZones.forEach(z => {
        ctx.fillRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
        ctx.strokeRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
    });
}

async function saveZonesToServer() {
    if (!appState.zoneEditorCam) return;
    await fetch(`/api/cameras/${appState.zoneEditorCam.id}/zones`, {
        method: "POST",
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({
            privacy_zones: appState.privacyZones,
            motion_zones: appState.motionZones,
            motion_sensitivity: parseInt(document.getElementById("zoneSensSlider").value, 10)
        })
    });
    await initApp();
    closeZoneModal();
}

/* ============================================================================
   ARCHIV & ZEITRAUM-FILTER (NUR FÜR ADMINISTRATOREN)
   ============================================================================ */
function populateArchiveCameraSelect() {
    const sel = document.getElementById("archCamSelect");
    sel.innerHTML = `<option value="">All</option>`;
    appState.cameras.forEach(c => {
        sel.innerHTML += `<option value="${c.id}">${c.name}</option>`;
    });
}

async function loadArchive() {
    if (appState.role !== "admin") return;
    const dateVal = document.getElementById("archDateSelect").value;
    const fromVal = document.getElementById("archFrom").value || "00:00";
    const toVal = document.getElementById("archTo").value || "23:59";
    const camVal = document.getElementById("archCamSelect").value;

    const params = new URLSearchParams({date: dateVal, from: fromVal, to: toVal, camera_id: camVal});
    const res = await fetch(`/api/archive?${params.toString()}`);
    if (!res.ok) return;
    const data = await res.json();

    const dateSelect = document.getElementById("archDateSelect");
    dateSelect.innerHTML = "";
    (data.available_dates || []).forEach(d => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        if (d === data.selected_date) opt.selected = true;
        dateSelect.appendChild(opt);
    });

    const tbody = document.getElementById("archiveTableBody");
    tbody.innerHTML = "";
    (data.recordings || []).forEach(rec => {
        const tr = document.createElement("tr");
        tr.innerHTML = `
            <td>${rec.date}</td>
            <td>${rec.time}</td>
            <td>${rec.camera_name}</td>
            <td><span class="badge">${rec.mode}</span></td>
            <td>${rec.size_mb} MB</td>
            <td style="display:flex; gap:6px;">
                <button class="btn btn-primary" onclick="playArchiveVideo('${rec.date}','${rec.filename}')">▶ Play</button>
                <a class="btn" href="/api/archive/video/${rec.date}/${rec.filename}?download=1" style="text-decoration:none;">⬇ MP4</a>
                <button class="btn btn-danger" onclick="deleteArchiveVideo('${rec.date}','${rec.filename}')">✕</button>
            </td>
        `;
        tbody.appendChild(tr);
    });
}

function playArchiveVideo(dateStr, filename) {
    const player = document.getElementById("archiveVideoPlayer");
    document.getElementById("videoModalTitle").textContent = `${dateStr} - ${filename}`;
    player.src = `/api/archive/video/${dateStr}/${filename}`;
    document.getElementById("videoModal").classList.remove("hidden");
    player.play();
}

function closeVideoModal() {
    const player = document.getElementById("archiveVideoPlayer");
    player.pause();
    player.src = "";
    document.getElementById("videoModal").classList.add("hidden");
}

async function deleteArchiveVideo(dateStr, filename) {
    await fetch(`/api/archive/video/${dateStr}/${filename}`, {method: "DELETE"});
    loadArchive();
}

function exportArchiveZip() {
    const dateVal = document.getElementById("archDateSelect").value;
    const fromVal = document.getElementById("archFrom").value || "00:00";
    const toVal = document.getElementById("archTo").value || "23:59";
    const camVal = document.getElementById("archCamSelect").value;
    if (!dateVal) return;
    const params = new URLSearchParams({date: dateVal, from: fromVal, to: toVal, camera_id: camVal});
    window.location.href = `/api/archive/export?${params.toString()}`;
}

window.addEventListener("DOMContentLoaded", initApp);
</script>
