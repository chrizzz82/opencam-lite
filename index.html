<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>OpenCam Lite</title>
  <script src="https://cdn.jsdelivr.net/npm/hls.js@1"></script>
  <style>
    :root {
      --bg: #0f172a;
      --panel: #1e293b;
      --panel-hover: #334155;
      --border: #334155;
      --text: #f8fafc;
      --muted: #94a3b8;
      --accent: #3b82f6;
      --accent-hover: #2563eb;
      --danger: #ef4444;
      --success: #22c55e;
      --warning: #f59e0b;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: var(--bg);
      color: var(--text);
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: var(--panel);
      border-bottom: 1px solid var(--border);
      padding: 0.85rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 1rem;
    }
    .brand {
      display: flex;
      align-items: center;
      gap: 0.75rem;
      font-size: 1.25rem;
      font-weight: 700;
    }
    .badge {
      font-size: 0.75rem;
      background: rgba(59, 130, 246, 0.2);
      color: #60a5fa;
      padding: 0.2rem 0.55rem;
      border-radius: 999px;
      border: 1px solid rgba(59, 130, 246, 0.4);
    }
    .top-actions {
      display: flex;
      align-items: center;
      gap: 0.65rem;
      flex-wrap: wrap;
    }
    .disk-pill {
      font-size: 0.82rem;
      color: var(--muted);
      background: rgba(15, 23, 42, 0.6);
      padding: 0.4rem 0.75rem;
      border-radius: 0.5rem;
      border: 1px solid var(--border);
    }
    button, select, input {
      background: var(--panel-hover);
      color: var(--text);
      border: 1px solid var(--border);
      padding: 0.45rem 0.85rem;
      border-radius: 0.5rem;
      font-size: 0.86rem;
      cursor: pointer;
    }
    button:hover { background: #475569; }
    button.primary { background: var(--accent); border-color: var(--accent); }
    button.primary:hover { background: var(--accent-hover); }
    button.danger { background: var(--danger); border-color: var(--danger); }
    button.active-zone { background: var(--warning); color: #000; border-color: var(--warning); font-weight: 600; }
    main {
      padding: 1.25rem;
      flex: 1;
    }
    .cam-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(var(--tile-width, 460px), 1fr));
      gap: 1.25rem;
    }
    .cam-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }
    .cam-header {
      padding: 0.65rem 1rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      gap: 0.5rem;
      flex-wrap: wrap;
    }
    .status-dot {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 0.45rem;
      background: var(--warning);
    }
    .status-dot.online { background: var(--success); box-shadow: 0 0 8px var(--success); }
    .video-wrap {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      background: #000;
    }
    video {
      width: 100%;
      height: 100%;
      object-fit: contain;
      display: block;
    }
    canvas.zone-canvas {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
    }
    canvas.zone-canvas.editing {
      pointer-events: auto;
      cursor: crosshair;
    }
    .ptz-bar {
      display: flex;
      gap: 0.2rem;
      background: rgba(15, 23, 42, 0.9);
      padding: 0.2rem 0.4rem;
      border-radius: 0.4rem;
      border: 1px solid var(--border);
    }
    .ptz-bar button {
      padding: 0.2rem 0.45rem;
      font-size: 0.75rem;
    }
    .cam-footer {
      padding: 0.6rem 0.9rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 0.5rem;
      flex-wrap: wrap;
      font-size: 0.8rem;
      color: var(--muted);
      border-top: 1px solid var(--border);
      background: rgba(15, 23, 42, 0.3);
    }
    .modal-backdrop {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.75);
      display: none;
      align-items: center;
      justify-content: center;
      z-index: 100;
      padding: 1rem;
    }
    .modal-backdrop.open { display: flex; }
    .modal {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 0.75rem;
      width: 100%;
      max-width: 1020px;
      max-height: 90vh;
      overflow-y: auto;
      padding: 1.25rem;
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }
    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--border);
      padding-bottom: 0.75rem;
    }
    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 0.75rem;
    }
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.82rem;
    }
    .archive-layout {
      display: grid;
      grid-template-columns: 1fr 1.35fr;
      gap: 1rem;
    }
    @media (max-width: 768px) {
      .archive-layout { grid-template-columns: 1fr; }
    }
    .rec-list {
      max-height: 420px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 0.45rem;
    }
    .rec-item {
      background: rgba(15, 23, 42, 0.65);
      border: 1px solid var(--border);
      border-radius: 0.5rem;
      padding: 0.55rem 0.75rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      cursor: pointer;
    }
    .rec-item:hover, .rec-item.active {
      border-color: var(--accent);
      background: rgba(59, 130, 246, 0.15);
    }
  </style>
</head>
<body>
  <header>
    <div class="brand">
      <span>📹 OpenCam Lite</span>
      <span class="badge">v0.2.0</span>
    </div>
    <div class="top-actions">
      <div class="disk-pill" id="diskInfo">--</div>
      <label style="font-size:0.82rem;color:var(--muted);">
        <span data-i18n="tile_size">Kachelgröße</span>:
        <input type="range" id="tileSizeSlider" min="320" max="900" step="20" value="460" style="vertical-align:middle;width:90px;">
      </label>
      <select id="langSelect" onchange="changeLanguage(this.value)">
        <option value="de">🇩🇪 Deutsch</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="es">🇪🇸 Español</option>
      </select>
      <button onclick="openArchiveModal()" data-i18n="btn_archive">🗂️ Archiv</button>
      <button class="primary" onclick="openSettingsModal()" data-i18n="btn_settings">⚙️ Einstellungen</button>
    </div>
  </header>

  <main>
    <div class="cam-grid" id="camGrid"></div>
  </main>

  <!-- ARCHIV MODAL (mit Tagesordner & Zeitspanne Von - Bis) -->
  <div class="modal-backdrop" id="archiveModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="archive_title">🗂️ Aufnahmen-Archiv & Zeitspanne</h3>
        <button onclick="closeArchiveModal()">✕</button>
      </div>
      <div class="form-grid">
        <div class="form-group">
          <label data-i18n="lbl_date_folder">📅 Tagesordner</label>
          <select id="archiveDateFilter" onchange="renderArchiveList()"></select>
        </div>
        <div class="form-group">
          <label data-i18n="lbl_cam_filter">📷 Kamera</label>
          <select id="archiveCamFilter" onchange="renderArchiveList()"></select>
        </div>
        <div class="form-group">
          <label data-i18n="lbl_time_from">⏳ Von Uhrzeit</label>
          <input type="time" id="archiveTimeFrom" value="00:00" oninput="renderArchiveList()">
        </div>
        <div class="form-group">
          <label data-i18n="lbl_time_to">⌛ Bis Uhrzeit</label>
          <input type="time" id="archiveTimeTo" value="23:59" oninput="renderArchiveList()">
        </div>
        <div class="form-group" style="justify-content:flex-end;">
          <label>&nbsp;</label>
          <button onclick="exportDayZip()" data-i18n="btn_zip_export">📦 Tag als ZIP</button>
        </div>
      </div>
      <div class="archive-layout">
        <div class="rec-list" id="archiveList"></div>
        <div style="display:flex;flex-direction:column;gap:0.6rem;">
          <video id="archivePlayer" controls style="width:100%;border-radius:0.5rem;background:#000;aspect-ratio:16/9;"></video>
          <div style="display:flex;justify-content:space-between;align-items:center;" id="archiveActions"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- EINSTELLUNGEN MODAL -->
  <div class="modal-backdrop" id="settingsModal">
    <div class="modal">
      <div class="modal-header">
        <h3 data-i18n="settings_title">⚙️ OpenCam Lite Einstellungen</h3>
        <button onclick="closeSettingsModal()">✕</button>
      </div>

      <div class="form-grid">
        <div class="form-group">
          <label data-i18n="lbl_retention">Aufbewahrung (Tage)</label>
          <input type="number" id="cfgRetention" min="1" max="365" value="7">
        </div>
        <div class="form-group">
          <label data-i18n="lbl_segment">24/7 Aufnahme-Intervall</label>
          <select id="cfgSegmentMinutes">
            <option value="15">15 min</option>
            <option value="30">30 min</option>
            <option value="45">45 min</option>
            <option value="60">60 min</option>
          </select>
        </div>
        <div class="form-group">
          <label data-i18n="lbl_ntfy">ntfy.sh Topic</label>
          <input type="text" id="cfgNtfy" placeholder="z.B. mein-homelab-cam">
        </div>
        <div class="form-group">
          <label data-i18n="lbl_webhook">Home Assistant Webhook</label>
          <input type="text" id="cfgWebhook" placeholder="http://homeassistant.local:8123/api/webhook/...">
        </div>
        <div class="form-group">
          <label data-i18n="btn_onvif">ONVIF Netzwerk-Scan</label>
          <button onclick="scanOnvif()" data-i18n="btn_onvif">🔍 Kameras im LAN suchen</button>
        </div>
      </div>

      <div id="onvifResults" style="font-size:0.84rem;color:#60a5fa;"></div>

      <hr style="border-color:var(--border);">
      <div style="display:flex;justify-content:space-between;align-items:center;">
        <h4 data-i18n="cameras_title">Kameras verwalten</h4>
        <button class="primary" onclick="addCameraRow()" data-i18n="btn_add_cam">+ Kamera hinzufügen</button>
      </div>
      <div id="cameraListEditor" style="display:flex;flex-direction:column;gap:0.85rem;"></div>

      <div style="display:flex;justify-content:flex-end;gap:0.65rem;margin-top:0.5rem;">
        <button onclick="closeSettingsModal()" data-i18n="btn_cancel">Abbrechen</button>
        <button class="primary" onclick="saveAllSettings()" data-i18n="btn_save">💾 Speichern & Streams neu starten</button>
      </div>
    </div>
  </div>

    let currentSettings = { cameras: [], retention_days: 7, segment_minutes: 15, language: 'de' };
    let cameraStatus = {};
    let archiveData = { events: [], dates: [] };
    let hlsInstances = {};
    let lastRestartCounts = {};
    let zoneEditMode = {};
    let dragStart = {};
    let lastOnvifState = null;

    function t(key) {
      const lang = currentSettings.language || 'de';
      return (I18N[lang] && I18N[lang][key]) || I18N.de[key] || key;
    }

    function applyTranslations() {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        el.textContent = t(el.getAttribute('data-i18n'));
      });
      if (lastOnvifState === 'searching') {
        document.getElementById('onvifResults').textContent = t('onvif_searching');
      } else if (lastOnvifState === 'none') {
        document.getElementById('onvifResults').textContent = t('onvif_none');
      }
    }

    const savedTileWidth = localStorage.getItem('opencam_tile_width') || '460';
    document.documentElement.style.setProperty('--tile-width', savedTileWidth + 'px');
    document.getElementById('tileSizeSlider').value = savedTileWidth;
    document.getElementById('tileSizeSlider').addEventListener('input', (e) => {
      const val = e.target.value;
      document.documentElement.style.setProperty('--tile-width', val + 'px');
      localStorage.setItem('opencam_tile_width', val);
    });

    async function init() {
      await fetchSettings();
      const savedLang = localStorage.getItem('opencam_lang') || currentSettings.language || 'de';
      currentSettings.language = savedLang;
      document.getElementById('langSelect').value = savedLang;
      applyTranslations();
      renderCameraGrid();
      await pollStatusAndDisk();
      setInterval(pollStatusAndDisk, 4000);
    }

    async function fetchSettings() {
      const res = await fetch('/api/settings');
      currentSettings = await res.json();
    }

    async function changeLanguage(lang) {
      currentSettings.language = lang;
      localStorage.setItem('opencam_lang', lang);
      applyTranslations();
      renderCameraGrid();
      renderCameraEditor();
      if (document.getElementById('archiveModal').classList.contains('open')) {
        await openArchiveModal();
      }
      await pollStatusAndDisk();
      await fetch('/api/language', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ language: lang })
      });
    }

    async function pollStatusAndDisk() {
      try {
        const [stRes, dskRes] = await Promise.all([fetch('/api/status'), fetch('/api/disk')]);
        cameraStatus = await stRes.json();
        const disk = await dskRes.json();
        document.getElementById('diskInfo').textContent =
          `${t('disk')}: ${disk.used_gb} / ${disk.total_gb} GB (${disk.percent}%)`;

        for (const cam of currentSettings.cameras || []) {
          const cid = String(cam.id);
          const st = cameraStatus[cid] || {};
          const dot = document.getElementById(`dot-${cid}`);
          const info = document.getElementById(`info-${cid}`);
          if (dot) dot.className = 'status-dot' + (st.online ? ' online' : '');
          if (info) {
            info.textContent = st.online
              ? `${cam.mode === 'always' ? t('status_rec') : t('status_live')} • ${t('reconnects')}: ${st.restarts || 0}`
              : `🟠 ${t('reconnecting')} (${st.restarts || 0})`;
          }

          if (st.online && lastRestartCounts[cid] !== undefined && st.restarts > lastRestartCounts[cid]) {
            attachHlsStream(cid);
          }
          lastRestartCounts[cid] = st.restarts || 0;
        }
      } catch (e) {
        console.warn('Status poll error:', e);
      }
    }

    function renderCameraGrid() {
      const grid = document.getElementById('camGrid');
      grid.innerHTML = '';
      Object.values(hlsInstances).forEach(h => { try { h.destroy(); } catch (_) {} });
      hlsInstances = {};

      for (const cam of currentSettings.cameras || []) {
        const cid = String(cam.id);
        const card = document.createElement('div');
        card.className = 'cam-card';
        card.innerHTML = `
          <div class="cam-header">
            <div><span class="status-dot" id="dot-${cid}"></span><strong>${cam.name || cid}</strong></div>
            <div style="display:flex;gap:0.35rem;flex-wrap:wrap;">
              <button id="btn-priv-${cid}" onclick="toggleZoneEdit('${cid}', 'privacy')">${t('priv_zone')}</button>
              <button id="btn-mot-${cid}" onclick="toggleZoneEdit('${cid}', 'motion')">${t('mot_zone')}</button>
              <button onclick="clearZones('${cid}')">${t('clear_zones')}</button>
              <button onclick="attachHlsStream('${cid}')" title="Reload">🔄</button>
              <button onclick="window.open('/api/snapshot?cam_id=${encodeURIComponent(cid)}', '_blank')" title="Snapshot">📸</button>
            </div>
          </div>
          <div class="video-wrap">
            <video id="video-${cid}" muted autoplay playsinline controls></video>
            <canvas class="zone-canvas" id="canvas-${cid}" width="640" height="360"></canvas>
          </div>
          <div class="cam-footer">
            <span id="info-${cid}">${t('connecting')}</span>
            ${cam.ptz ? `
              <div class="ptz-bar">
                <button onmousedown="sendPtz('${cid}','move','left')" onmouseup="sendPtz('${cid}','stop')">◀</button>
                <button onmousedown="sendPtz('${cid}','move','up')" onmouseup="sendPtz('${cid}','stop')">▲</button>
                <button onmousedown="sendPtz('${cid}','move','down')" onmouseup="sendPtz('${cid}','stop')">▼</button>
                <button onmousedown="sendPtz('${cid}','move','right')" onmouseup="sendPtz('${cid}','stop')">▶</button>
              </div>
            ` : ''}
            <span>${cam.ip || ''} (${(cam.quality || cam.res || 'hd').toUpperCase()})</span>
          </div>
        `;
        grid.appendChild(card);
        setupZoneCanvas(cid);
        drawZonesOnCanvas(cid);
        attachHlsStream(cid);
      }
    }

    function attachHlsStream(cid) {
      const video = document.getElementById(`video-${cid}`);
      if (!video) return;
      if (hlsInstances[cid]) {
        try { hlsInstances[cid].destroy(); } catch (_) {}
      }
      const streamUrl = `/stream/${encodeURIComponent(cid)}/index.m3u8?t=${Date.now()}`;
      if (Hls.isSupported()) {
        const hls = new Hls({
          liveSyncDurationCount: 2,
          manifestLoadingMaxRetry: Infinity,
          manifestLoadingRetryDelay: 2000,
          levelLoadingMaxRetry: Infinity,
          fragLoadingMaxRetry: Infinity
        });
        hls.loadSource(streamUrl);
        hls.attachMedia(video);
        hls.on(Hls.Events.MANIFEST_PARSED, () => {
          video.play().catch(() => {});
        });
        hls.on(Hls.Events.ERROR, (event, data) => {
          if (data.fatal) {
            setTimeout(() => attachHlsStream(cid), 2500);
          }
        });
        hlsInstances[cid] = hls;
      } else if (video.canPlayType('application/vnd.apple.mpegurl')) {
        video.src = streamUrl;
      }
    }

    function setupZoneCanvas(cid) {
      const canvas = document.getElementById(`canvas-${cid}`);
      if (!canvas) return;

      canvas.addEventListener('mousedown', (e) => {
        if (!zoneEditMode[cid]) return;
        const rect = canvas.getBoundingClientRect();
        dragStart[cid] = {
          x: (e.clientX - rect.left) / rect.width,
          y: (e.clientY - rect.top) / rect.height
        };
      });

      canvas.addEventListener('mouseup', async (e) => {
        const mode = zoneEditMode[cid];
        const start = dragStart[cid];
        if (!mode || !start) return;
        dragStart[cid] = null;

        const rect = canvas.getBoundingClientRect();
        const endX = (e.clientX - rect.left) / rect.width;
        const endY = (e.clientY - rect.top) / rect.height;

        const x = Math.max(0, Math.min(start.x, endX));
        const y = Math.max(0, Math.min(start.y, endY));
        const w = Math.min(1 - x, Math.abs(endX - start.x));
        const h = Math.min(1 - y, Math.abs(endY - start.y));
        if (w < 0.02 || h < 0.02) return;

        const cam = (currentSettings.cameras || []).find(c => String(c.id) === cid);
        if (!cam) return;
        if (mode === 'privacy') {
          cam.privacy_zones = cam.privacy_zones || [];
          cam.privacy_zones.push({ x, y, w, h });
        } else {
          cam.motion_zones = cam.motion_zones || [];
          cam.motion_zones.push({ x, y, w, h });
        }
        drawZonesOnCanvas(cid);
        const res = await fetch('/api/settings', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(currentSettings)
        });
        currentSettings = await res.json();
      });
    }

    function toggleZoneEdit(cid, type) {
      zoneEditMode[cid] = zoneEditMode[cid] === type ? null : type;
      const canvas = document.getElementById(`canvas-${cid}`);
      const btnP = document.getElementById(`btn-priv-${cid}`);
      const btnM = document.getElementById(`btn-mot-${cid}`);
      if (canvas) canvas.className = 'zone-canvas' + (zoneEditMode[cid] ? ' editing' : '');
      if (btnP) btnP.className = zoneEditMode[cid] === 'privacy' ? 'active-zone' : '';
      if (btnM) btnM.className = zoneEditMode[cid] === 'motion' ? 'active-zone' : '';
    }

    async function clearZones(cid) {
      const cam = (currentSettings.cameras || []).find(c => String(c.id) === cid);
      if (!cam) return;
      cam.privacy_zones = [];
      cam.mask_zones = [];
      cam.motion_zones = [];
      drawZonesOnCanvas(cid);
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentSettings)
      });
      currentSettings = await res.json();
    }

    function drawZonesOnCanvas(cid) {
      const canvas = document.getElementById(`canvas-${cid}`);
      if (!canvas) return;
      const ctx = canvas.getContext('2d');
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const cam = (currentSettings.cameras || []).find(c => String(c.id) === cid);
      if (!cam) return;

      (cam.privacy_zones || cam.mask_zones || []).forEach(z => {
        ctx.fillStyle = 'rgba(0, 0, 0, 0.85)';
        ctx.fillRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
      });

      (cam.motion_zones || []).forEach(z => {
        ctx.strokeStyle = '#22c55e';
        ctx.lineWidth = 2;
        ctx.fillStyle = 'rgba(34, 197, 94, 0.18)';
        ctx.fillRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
        ctx.strokeRect(z.x * canvas.width, z.y * canvas.height, z.w * canvas.width, z.h * canvas.height);
      });
    }

    async function sendPtz(cid, action, direction = 'stop') {
      await fetch('/api/ptz', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ cam_id: cid, action, direction })
      });
    }

    async function openArchiveModal() {
      document.getElementById('archiveModal').classList.add('open');
      const res = await fetch('/api/events');
      archiveData = await res.json();

      const dateSel = document.getElementById('archiveDateFilter');
      dateSel.innerHTML = `<option value="ALL">${t('all_days')} (${archiveData.dates.length})</option>` +
        archiveData.dates.map(d => `<option value="${d}">📁 ${d}</option>`).join('');
      if (archiveData.dates.length > 0 && dateSel.value === 'ALL') {
        dateSel.value = archiveData.dates[0];
      }

      const camSel = document.getElementById('archiveCamFilter');
      const cams = Array.from(new Set(archiveData.events.map(e => e.cam_name)));
      camSel.innerHTML = `<option value="ALL">${t('all_cams')}</option>` +
        cams.map(c => `<option value="${c}">${c}</option>`).join('');

      renderArchiveList();
    }

    function closeArchiveModal() {
      const player = document.getElementById('archivePlayer');
      if (player) {
        player.pause();
        player.src = '';
      }
      document.getElementById('archiveModal').classList.remove('open');
    }

    function renderArchiveList() {
      const dateFilter = document.getElementById('archiveDateFilter').value;
      const camFilter = document.getElementById('archiveCamFilter').value;
      const timeFrom = document.getElementById('archiveTimeFrom').value.trim(); // z.B. "10:00"
      const timeTo = document.getElementById('archiveTimeTo').value.trim();     // z.B. "18:30"
      const listEl = document.getElementById('archiveList');

      const filtered = (archiveData.events || []).filter(ev => {
        if (dateFilter !== 'ALL' && ev.date !== dateFilter) return false;
        if (camFilter !== 'ALL' && ev.cam_name !== camFilter) return false;

        // Zeitspanne-Filterung (ev.time_str ist im Format "HH:MM:SS")
        if (timeFrom || timeTo) {
          const itemTime = ev.time_str.substring(0, 5); // "HH:MM"
          if (timeFrom && itemTime < timeFrom) return false;
          if (timeTo && itemTime > timeTo) return false;
        }
        return true;
      });

      if (filtered.length === 0) {
        listEl.innerHTML = `<div style="color:var(--muted);padding:1rem;">${t('no_recordings')}</div>`;
        return;
      }

      listEl.innerHTML = filtered.map(ev => `
        <div class="rec-item" onclick="playArchiveItem('${encodeURIComponent(ev.rel_path)}', '${ev.url}', '${ev.filename}')">
          <div>
            <strong>${ev.cam_name}</strong> • <span>${ev.date}</span> • <span>${ev.time_str}</span>
            <div style="font-size:0.75rem;color:var(--muted);">📁 ${ev.rel_path}</div>
          </div>
          <div style="text-align:right;font-size:0.78rem;">
            <div>${ev.size_mb} MB</div>
          </div>
        </div>
      `).join('');
    }

    function playArchiveItem(encodedRelPath, url, filename) {
      const player = document.getElementById('archivePlayer');
      player.src = url;
      player.play().catch(() => {});
      const relPath = decodeURIComponent(encodedRelPath);
      document.getElementById('archiveActions').innerHTML = `
        <a href="/api/export?file=${encodeURIComponent(relPath)}" download="${filename}">
          <button class="primary">${t('btn_mp4_download')}</button>
        </a>
        <button class="danger" onclick="deleteRecording('${encodeURIComponent(relPath)}')">${t('btn_delete')}</button>
      `;
    }

    async function exportDayZip() {
      const dateFilter = document.getElementById('archiveDateFilter').value;
      const targetDate = dateFilter === 'ALL' ? (archiveData.dates[0] || '') : dateFilter;
      if (!targetDate) return;
      window.open(`/api/export?date=${encodeURIComponent(targetDate)}`, '_blank');
    }

    async function deleteRecording(encodedRelPath) {
      const relPath = decodeURIComponent(encodedRelPath);
      await fetch(`/api/events?file=${encodeURIComponent(relPath)}`, { method: 'DELETE' });
      await openArchiveModal();
    }

    function openSettingsModal() {
      document.getElementById('cfgRetention').value = currentSettings.retention_days || 7;
      document.getElementById('cfgSegmentMinutes').value = String(currentSettings.segment_minutes || 15);
      document.getElementById('cfgNtfy').value = currentSettings.ntfy_topic || '';
      document.getElementById('cfgWebhook').value = currentSettings.ha_webhook || '';
      applyTranslations();
      renderCameraEditor();
      document.getElementById('settingsModal').classList.add('open');
    }

    function closeSettingsModal() {
      document.getElementById('settingsModal').classList.remove('open');
    }

    function renderCameraEditor() {
      const container = document.getElementById('cameraListEditor');
      if (!container) return;
      container.innerHTML = '';
      (currentSettings.cameras || []).forEach((cam, idx) => {
        const row = document.createElement('div');
        row.style.cssText = 'background:rgba(15,23,42,0.65);border:1px solid var(--border);padding:0.85rem;border-radius:0.5rem;';
        row.innerHTML = `
          <div class="form-grid">
            <div class="form-group">
              <label>${t('cam_name')}</label>
              <input type="text" value="${cam.name || ''}" onchange="currentSettings.cameras[${idx}].name=this.value">
            </div>
            <div class="form-group">
              <label>${t('cam_brand')}</label>
              <select onchange="currentSettings.cameras[${idx}].brand=this.value">
                ${['tapo','reolink','hikvision','dahua','amcrest','foscam','uniview','axis','generic'].map(b =>
                  `<option value="${b}" ${(cam.brand||'tapo')===b?'selected':''}>${b.toUpperCase()}</option>`
                ).join('')}
              </select>
            </div>
            <div class="form-group">
              <label>${t('cam_ip')}</label>
              <input type="text" value="${cam.ip || ''}" onchange="currentSettings.cameras[${idx}].ip=this.value">
            </div>
            <div class="form-group">
              <label>${t('cam_user')}</label>
              <input type="text" value="${cam.user || ''}" onchange="currentSettings.cameras[${idx}].user=this.value">
            </div>
            <div class="form-group">
              <label>${t('cam_pass')}</label>
              <input type="password" value="${cam.password || ''}" onchange="currentSettings.cameras[${idx}].password=this.value">
            </div>
            <div class="form-group">
              <label>${t('cam_stream')}</label>
              <select onchange="currentSettings.cameras[${idx}].quality=this.value">
                <option value="hd" ${(cam.quality||cam.res||'hd')==='hd'?'selected':''}>${t('stream_hd')}</option>
                <option value="sd" ${(cam.quality||cam.res)==='sd'?'selected':''}>${t('stream_sd')}</option>
              </select>
            </div>
            <div class="form-group">
              <label>${t('cam_mode')}</label>
              <select onchange="currentSettings.cameras[${idx}].mode=this.value">
                <option value="live" ${cam.mode==='live'?'selected':''}>${t('mode_live')}</option>
                <option value="always" ${cam.mode==='always'?'selected':''}>${t('mode_always')}</option>
              </select>
            </div>
          </div>
          <div style="margin-top:0.65rem;display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:0.5rem;">
            <div style="display:flex;gap:1rem;font-size:0.84rem;">
              <label><input type="checkbox" ${cam.audio?'checked':''} onchange="currentSettings.cameras[${idx}].audio=this.checked"> ${t('cam_audio')}</label>
              <label><input type="checkbox" ${cam.ptz?'checked':''} onchange="currentSettings.cameras[${idx}].ptz=this.checked"> ${t('cam_ptz')}</label>
            </div>
            <button class="danger" onclick="currentSettings.cameras.splice(${idx},1);renderCameraEditor();">${t('btn_remove_cam')}</button>
          </div>
        `;
        container.appendChild(row);
      });
    }

    function addCameraRow() {
      if (!currentSettings.cameras) currentSettings.cameras = [];
      currentSettings.cameras.push({
        id: 'cam_' + Date.now(),
        name: `${t('default_cam_name')} ${currentSettings.cameras.length + 1}`,
        brand: 'tapo',
        ip: '192.168.178.',
        user: '',
        password: '',
        quality: 'hd',
        mode: 'always',
        audio: true,
        ptz: false,
        privacy_zones: [],
        motion_zones: []
      });
      renderCameraEditor();
    }

    async function scanOnvif() {
      const box = document.getElementById('onvifResults');
      lastOnvifState = 'searching';
      box.textContent = t('onvif_searching');
      const res = await fetch('/api/onvif_scan');
      const data = await res.json();
      if (!data.devices || data.devices.length === 0) {
        lastOnvifState = 'none';
        box.textContent = t('onvif_none');
        return;
      }
      lastOnvifState = null;
      box.innerHTML = data.devices.map(d =>
        `<button style="margin:0.15rem;" onclick="addDiscoveredCam('${d.ip}','${d.brand}')">+ ${d.name}</button>`
      ).join(' ');
    }

    function addDiscoveredCam(ip, brand) {
      currentSettings.cameras.push({
        id: 'cam_' + Date.now(),
        name: `${brand.toUpperCase()} (${ip})`,
        brand: brand,
        ip: ip,
        user: '',
        password: '',
        quality: 'hd',
        mode: 'always',
        audio: true,
        ptz: false,
        privacy_zones: [],
        motion_zones: []
      });
      renderCameraEditor();
    }

    async function saveAllSettings() {
      currentSettings.retention_days = parseInt(document.getElementById('cfgRetention').value || '7', 10);
      currentSettings.segment_minutes = parseInt(document.getElementById('cfgSegmentMinutes').value || '15', 10);
      currentSettings.ntfy_topic = document.getElementById('cfgNtfy').value.trim();
      currentSettings.ha_webhook = document.getElementById('cfgWebhook').value.trim();
      const res = await fetch('/api/settings', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(currentSettings)
      });
      currentSettings = await res.json();
      closeSettingsModal();
      renderCameraGrid();
      await pollStatusAndDisk();
    }

    init();
  </script>
