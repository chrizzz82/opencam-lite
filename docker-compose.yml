name: opencam-lite
services:
  opencam-lite:
    build: .
    image: ghcr.io/chrizz82/opencam-lite:latest
    container_name: opencam-lite
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Berlin
      - PORT=7777
     volumes:
      - /DATA/AppData/opencam-lite/config:/config
      - /DATA/AppData/opencam-lite/recordings:/recordings
      # - /DATA/Media/Backup/opencam:/backup
