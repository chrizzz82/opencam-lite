name: opencam-lite
services:
  opencam-lite:
    image: ghcr.io/chrizz82/opencam-lite:latest
    container_name: opencam-lite
    restart: unless-stopped
    network_mode: host
    environment:
      - TZ=Europe/Berlin
    volumes:
      - ./config:/config
      - ./recordings:/recordings
    labels:
      net.bigbear.casaos.name: "OpenCam Lite"
      net.bigbear.casaOS.icon: "https://raw.githubusercontent.com/chrizzz82/opencam-lite/main/icon.png"