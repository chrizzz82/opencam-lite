name: opencam-lite
services:
  opencam-lite:
    build: .
    image: opencam-lite:latest
    container_name: opencam-lite
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - TZ=Europe/Berlin
      - SECRET_KEY=opencam_local_secret_key_change_if_needed
      - CONFIG_DIR=/config
      - RECORDINGS_DIR=/recordings
    volumes:
      - /DATA/AppData/opencam-lite/config:/config
      - /DATA/AppData/opencam-lite/recordings:/recordings